name: Prova de miniatures (temporal)
on:
  push:
    branches: ["claude/**"]
    paths: ["hds/thumbnail.py", "tests/thumb_samples.json", ".github/workflows/thumb-test.yml"]
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-models-v1 }
      - name: Miniatures de prova
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from hds import thumbnail
          for s in json.loads(Path("tests/thumb_samples.json").read_text()):
              if "label" in s: s["thumbnail"]["label"] = s["label"]
              w = Path("out") / s["name"]; w.mkdir(parents=True, exist_ok=True)
              thumbnail.make(s, w)
          PY
      - name: Desar les proves a la branca
        run: |
          rm -rf proves-miniatura && mkdir proves-miniatura && cp -r out/* proves-miniatura/
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add proves-miniatura && git commit -m "Proves de miniatura [skip ci]" && git pull --rebase && git push
